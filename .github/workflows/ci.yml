name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  LC_ALL: C
  TZ: UTC

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v4
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml

  schema-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Verify schema checksum
        run: |
          EXPECTED=$(cat .schema_checksum)
          ACTUAL=$(sha256sum mtb/schema/mtb.schema.json | cut -d' ' -f1)
          
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "FAIL: Schema has been modified"
            echo "Expected: $EXPECTED"
            echo "Actual: $ACTUAL"
            exit 1
          fi
          echo "PASS: Schema checksum verified"

  cli-flag-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Test unknown flag rejection
        run: |
          set +e
          python -m cli --unknown-flag 2>&1
          EXIT=$?
          set -e
          
          if [ "$EXIT" -eq 0 ]; then
            echo "FAIL: Unknown flag should be rejected"
            exit 1
          fi
          echo "PASS: Unknown flag rejected"

  mtb-determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Test MTB hash determinism
        run: |
          python3 -c "import json,hashlib;h=lambda d:hashlib.sha256(json.dumps(d,sort_keys=True).encode()).hexdigest();m1={'files':['a','b','c'],'version':'1.0'};m2={'version':'1.0','files':['a','b','c']};assert h(m1)==h(m2);print('PASS: MTB hash is deterministic')"

  pypi-disabled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Assert PyPI publishing disabled
        run: |
          if [ ! -f PYPI_DISABLED ]; then
            echo "FAIL: PYPI_DISABLED file missing"
            exit 1
          fi
          
          if grep -rE "uses:.*pypi" .github/workflows/ --include="*.yml" | grep -v "ci.yml"; then
            echo "FAIL: PyPI publish action found in workflows"
            exit 1
          fi
          
          echo "PASS: PyPI publishing disabled"

  failure-codes-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Verify FAILURE_CODES.json checksum
        run: |
          EXPECTED=$(cat .failure_codes_checksum)
          ACTUAL=$(sha256sum FAILURE_CODES.json | cut -d' ' -f1)
          
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "FAIL: FAILURE_CODES.json has been modified"
            echo "Expected: $EXPECTED"
            echo "Actual: $ACTUAL"
            exit 6
          fi
          echo "PASS: FAILURE_CODES.json checksum verified"
