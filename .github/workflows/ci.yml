name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@34e1148ab8c88cfd102cc39c0ff8041a19fc37d2 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml

  schema-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e1148ab8c88cfd102cc39c0ff8041a19fc37d2 # v4

      - name: Verify schema checksum
        run: |
          EXPECTED=$(cat .schema_checksum)
          ACTUAL=$(sha256sum mtb/schema/mtb.schema.json | cut -d' ' -f1)
          
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "FAIL: Schema has been modified"
            echo "Expected: $EXPECTED"
            echo "Actual: $ACTUAL"
            exit 1
          fi
          echo "PASS: Schema checksum verified"

  cli-flag-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e1148ab8c88cfd102cc39c0ff8041a19fc37d2 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Test unknown flag rejection
        run: |
          set +e
          python -m cli --unknown-flag 2>&1
          EXIT=$?
          set -e
          
          if [ "$EXIT" -eq 0 ]; then
            echo "FAIL: Unknown flag should be rejected"
            exit 1
          fi
          echo "PASS: Unknown flag rejected"

  mtb-determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e1148ab8c88cfd102cc39c0ff8041a19fc37d2 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Test MTB hash determinism
        run: python3 -c "import json,hashlib;h=lambda d:hashlib.sha256(json.dumps(d,sort_keys=True).encode()).hexdigest();m1={'files':['a','b','c'],'version':'1.0'};m2={'version':'1.0','files':['a','b','c']};assert h(m1)==h(m2),'Hash mismatch';print('PASS: MTB hash is deterministic')"

  pypi-disabled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e1148ab8c88cfd102cc39c0ff8041a19fc37d2 # v4

      - name: Assert PyPI publishing disabled
        run: |
          if [ ! -f PYPI_DISABLED ]; then
            echo "FAIL: PYPI_DISABLED file missing"
            exit 1
          fi
          
          if grep -r "pypi-publish" .github/workflows/; then
            echo "FAIL: PyPI publish action found in workflows"
            exit 1
          fi
          
          echo "PASS: PyPI publishing disabled"
# Trigger CI rebuild
