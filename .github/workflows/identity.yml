name: Identity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify MK10-PRO public identity
        run: |
          test "$(cat VERSION)" = "1.0.3"
          test -f PYPI_RELEASE_POLICY.md
          test ! -f PYPI_DISABLED
          test -f PACKAGE_SURFACES.json
          test -f docs/PACKAGE_SURFACES.md
          test -f docs/NPM_BOUNDARY.md
          test -f docs/PKG_BOUNDARY.md
          test -f .github/workflows/publish.yml
          test -f .github/workflows/publish-npm.yml
          test -f .github/workflows/publish-pkg.yml

          grep -q 'Witness Release' PYPI_RELEASE_POLICY.md
          grep -q 'PYPI' README.md
          grep -q 'NPM' README.md
          grep -q 'PKG' README.md

          python - <<'PY'
          from pathlib import Path
          import json
          import re

          surfaces = json.loads(Path("PACKAGE_SURFACES.json").read_text())
          assert surfaces["version"] == "1.0.3"
          assert surfaces["package_surfaces"]["pypi"]["package"] == "mk10-pro"
          assert surfaces["package_surfaces"]["npm"]["package"] == "@kaaffilm/mk10-pro"
          assert surfaces["package_surfaces"]["pkg"]["registry"] == "https://npm.pkg.github.com"

          pyproject = Path("pyproject.toml").read_text()
          assert 'version = "1.0.3"' in pyproject
          assert 'license = "Apache-2.0"' in pyproject

          readme = Path("README.md").read_text()
          assert "PyPI publishing: disabled by `PYPI_DISABLED`" not in readme
          assert "NPM and PKG are launcher/discovery surfaces" in readme

          print("MK10-PRO IDENTITY: PASS")
          PY
