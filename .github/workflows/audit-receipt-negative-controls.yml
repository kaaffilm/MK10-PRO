name: Audit Receipt Negative Controls

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-receipt-negative-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest build pyyaml

      - name: Verify audit receipt negative controls
        run: |
          python -m pytest tests/test_audit_receipt_negative_controls.py
          bash scripts/audit-receipt-negative-proof.sh "$RUNNER_TEMP/mk10-pro-audit-receipt-negative-controls"
