name: Audit Receipt

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest build pyyaml

      - name: Verify audit receipt
        run: |
          python -m pytest tests/test_public_surface_lock.py tests/test_public_replay_perimeter.py tests/test_auditor_entrypoint.py tests/test_audit_packet.py tests/test_audit_receipt.py
          bash scripts/audit-receipt-proof.sh "$RUNNER_TEMP/mk10-pro-audit-receipt"
