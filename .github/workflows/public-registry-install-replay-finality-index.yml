name: public-registry-install-replay-finality-index

on:
  pull_request:
  push:

permissions:
  contents: read
  pull-requests: read

jobs:
  public-registry-install-replay-finality-index:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      LIVE_PUBLIC_REGISTRY_INSTALL_REPLAY_FINALITY_INDEX: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify MK10-PRO v1.0.3 public registry install replay finality index
        run: bash scripts/public-registry-install-replay-finality-index.sh

      - name: Static pytest boundary
        run: python -m pytest tests/test_public_registry_install_replay_finality_index.py -q
