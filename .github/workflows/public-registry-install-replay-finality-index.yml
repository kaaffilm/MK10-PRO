name: public-registry-install-replay-finality-index

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  public-registry-install-replay-finality-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify MK10-PRO v1.0.3 public registry install replay finality index
        env:
          MK10_PRO_LIVE_FINALITY_INDEX: "1"
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/public-registry-install-replay-finality-index.sh
          rm -f \
            MK10_PRO_PUBLIC_REGISTRY_ARTIFACT_LOCK_RECEIPT.json \
            MK10_PRO_PUBLIC_REGISTRY_INSTALL_REPLAY_RECEIPT.json \
            MK10_PRO_PUBLIC_REGISTRY_RELEASE_READINESS_RECEIPT.json \
            MK10_PRO_PUBLIC_PACKAGE_INSTALL_REPLAY_RECEIPT.json \
            MK10_PRO_PUBLIC_RELEASE_SEAL_RECEIPT.json \
            MK10_PRO_PUBLIC_REGISTRY_INSTALL_REPLAY_FINALITY_INDEX_RECEIPT.json

      - name: Assert no generated root receipts remain
        run: |
          test ! -e MK10_PRO_PUBLIC_REGISTRY_ARTIFACT_LOCK_RECEIPT.json
          test ! -e MK10_PRO_PUBLIC_REGISTRY_INSTALL_REPLAY_RECEIPT.json
          test ! -e MK10_PRO_PUBLIC_REGISTRY_RELEASE_READINESS_RECEIPT.json
          test ! -e MK10_PRO_PUBLIC_PACKAGE_INSTALL_REPLAY_RECEIPT.json
          test ! -e MK10_PRO_PUBLIC_RELEASE_SEAL_RECEIPT.json
          test ! -e MK10_PRO_PUBLIC_REGISTRY_INSTALL_REPLAY_FINALITY_INDEX_RECEIPT.json
