name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    name: publish-to-pypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mk10-pro
    permissions:
      contents: read
      id-token: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Assert witness release
        run: |
          test -f PYPI_RELEASE_POLICY.md
          test ! -f PYPI_DISABLED
          test "$(cat VERSION)" = "1.0.3"
          grep -q 'version = "1.0.3"' pyproject.toml
          grep -q 'license = "Apache-2.0"' pyproject.toml
          grep -q 'Witness Release' PYPI_RELEASE_POLICY.md

      - name: Build distributions
        run: python -m build --sdist --wheel

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
