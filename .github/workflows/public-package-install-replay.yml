name: public-package-install-replay

on:
  push:
  pull_request:

jobs:
  public-package-install-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify public package install replay
        run: bash scripts/public-package-install-replay.sh
