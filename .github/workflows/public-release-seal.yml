name: public-release-seal

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  public-release-seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify public release seal
        run: bash scripts/public-release-seal.sh
