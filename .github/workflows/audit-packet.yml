name: Audit Packet

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest build pyyaml

      - name: Verify audit packet
        run: |
          python -m pytest tests/test_public_surface_lock.py tests/test_public_replay_perimeter.py tests/test_auditor_entrypoint.py tests/test_audit_packet.py
          bash scripts/audit-packet-proof.sh
