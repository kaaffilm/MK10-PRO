name: Audit Receipt Schema

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-receipt-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest build pyyaml

      - name: Verify audit receipt schema
        run: |
          python -m pytest tests/test_audit_receipt_schema.py
          bash scripts/audit-receipt-schema-proof.sh "$RUNNER_TEMP/mk10-pro-audit-receipt-schema"
