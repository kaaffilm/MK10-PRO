name: Publish PKG

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-github-packages:
    name: publish-to-github-packages
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'v1.0.3'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@kaaffilm"

      - name: Configure GitHub Packages package name
        working-directory: packages/npm
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.publishConfig = {
            registry: "https://npm.pkg.github.com",
            access: "public"
          };
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          NODE

      - name: Assert PKG surface
        working-directory: packages/npm
        run: |
          test "$(node -p "require('./package.json').name")" = "@kaaffilm/mk10-pro"
          test "$(node -p "require('./package.json').version")" = "1.0.3"
          npm test
          npm pack --dry-run

      - name: Publish to GitHub Packages
        working-directory: packages/npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
