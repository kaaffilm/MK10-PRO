name: public-registry-install-replay-release-object-seal

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-registry-install-replay-release-object-seal:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify MK10-PRO v1.0.3 public registry install replay release object seal
        run: |
          bash scripts/public-registry-install-replay-release-object-seal.sh
