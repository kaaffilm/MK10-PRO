name: External Audit Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-audit-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest build pyyaml

      - name: Verify external audit gate
        run: |
          python -m pytest tests/test_external_audit_gate.py
          bash scripts/external-audit-gate.sh "$RUNNER_TEMP/mk10-pro-external-audit-gate"
