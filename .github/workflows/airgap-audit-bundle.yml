name: airgap-audit-bundle

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  airgap-audit-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify airgap audit bundle
        shell: bash
        run: bash scripts/airgap-audit-bundle.sh
