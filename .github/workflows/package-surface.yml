name: Package Surface

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-package-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify public package surface files
        run: |
          test "$(cat VERSION)" = "1.0.3"
          test -f PACKAGE_SURFACES.json
          test -f docs/PACKAGE_SURFACES.md
          test -f docs/NPM_BOUNDARY.md
          test -f docs/PKG_BOUNDARY.md
          test -f packages/npm/package.json
          test -x packages/npm/bin/mk10-pro.js
          grep -q '"pypi"' PACKAGE_SURFACES.json
          grep -q '"npm"' PACKAGE_SURFACES.json
          grep -q '"pkg"' PACKAGE_SURFACES.json
          grep -q 'PYPI' README.md
          grep -q 'NPM' README.md
          grep -q 'PKG' README.md
          ! grep -q 'PyPI publishing: disabled by `PYPI_DISABLED`' README.md

      - name: Verify Python witness surface
        run: |
          python -m pip install --upgrade pip pytest build >/dev/null
          python -m pip install -r requirements.txt >/dev/null
          python -m cli --version
          python -m cli proof
          python -m cli boundary
          python -m pytest -q

      - name: Verify NPM launcher surface
        working-directory: packages/npm
        run: |
          npm test
          npm pack --dry-run
