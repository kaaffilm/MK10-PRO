name: Public Surface Lock

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-surface-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify MK10-PRO v1.0.3 public surface lock
        run: |
          test "$(cat VERSION)" = "1.0.3"

          python tests/test_public_surface_lock.py
          MK10_PRO_SKIP_LIVE=1 bash scripts/public-surface-proof.sh

          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("packages/npm/package.json","utf8")); const s=JSON.parse(fs.readFileSync("PACKAGE_SURFACES.json","utf8")); if(p.version!=="1.0.3") process.exit(1); if(s.version!=="1.0.3") process.exit(1); if(s.version_lock.locked_version!=="1.0.3") process.exit(1); if(s.version_lock.canonical_runtime_witness!=="pypi") process.exit(1); console.log("NODE_PUBLIC_SURFACE_LOCK: PASS")'

          cd packages/npm
          npm test
          npm pack --dry-run
          cd ../..

          grep -q "MK10-PRO FINAL PUBLIC SURFACE COMPLETION LOCK" README.md
          grep -q "No-version-raise package lock" README.md
          grep -q "canonical runtime witness" PUBLIC_SURFACE.md
          grep -q "canonical runtime witness" docs/PUBLIC_SURFACE_LOCK.md
          grep -q "Do not raise the public package version" README.md

          find . -name "kaaffilm-mk10-pro-*.tgz" -delete

          echo "MK10-PRO PUBLIC SURFACE LOCK CI: PASS"
