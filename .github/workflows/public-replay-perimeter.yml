name: Public Replay Perimeter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-replay-perimeter:
    name: public-replay-perimeter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify public replay perimeter
        run: |
          set -euo pipefail

          test "$(cat VERSION)" = "1.0.3"
          test -f PACKAGE_SURFACES.json
          test -f PUBLIC_SURFACE.md
          test -f docs/PUBLIC_SURFACE_LOCK.md
          test -f docs/PUBLIC_REPLAY_PERIMETER.md
          test -x scripts/public-surface-proof.sh
          test -x scripts/public-replay-proof.sh
          test -f tests/test_public_surface_lock.py
          test -f tests/test_public_replay_perimeter.py

          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml build

          python -m pytest tests/test_public_surface_lock.py tests/test_public_replay_perimeter.py
          bash scripts/public-surface-proof.sh
          bash scripts/public-replay-proof.sh

          cd packages/npm
          npm test
          npm pack --dry-run
