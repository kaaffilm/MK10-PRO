name: Publish NPM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: publish-to-npmjs
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'v1.0.3'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Assert NPM trusted-publish surface
        working-directory: packages/npm
        run: |
          node --version
          npm --version
          npm install -g npm@latest
          npm --version
          node - <<'NODE'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));

          if (pkg.name !== "@kaaffilm/mk10-pro") throw new Error("wrong package name");
          if (pkg.version !== "1.0.3") throw new Error("wrong package version");

          pkg.repository = {
            type: "git",
            url: "https://github.com/kaaffilm/MK10-PRO"
          };

          pkg.publishConfig = {
            access: "public",
            provenance: true
          };

          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          NODE
          npm test
          npm pack --dry-run

      - name: Publish to npmjs
        working-directory: packages/npm
        run: |
          npm publish --access public
