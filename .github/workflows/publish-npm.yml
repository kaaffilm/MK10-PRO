name: Publish NPM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: publish-to-npmjs
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'v1.0.3'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Assert NPM surface
        working-directory: packages/npm
        run: |
          test "$(node -p "require('./package.json').name")" = "@kaaffilm/mk10-pro"
          test "$(node -p "require('./package.json').version")" = "1.0.3"
          npm test
          npm pack --dry-run

      - name: Publish to npm
        working-directory: packages/npm
        run: npm publish --provenance --access public
